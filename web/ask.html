<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("buswatch.theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BusWatch - Ask BusWatch</title>
  <meta name="description" content="BusWatch: campus bus demand analytics (simulated data).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='17' rx='4' fill='none' stroke='%23465fff' stroke-width='2.5'/%3E%3Ccircle cx='10' cy='26' r='2.5' fill='%23465fff'/%3E%3Ccircle cx='22' cy='26' r='2.5' fill='%23465fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8" defer></script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="content">
    <div class="page-head"><h1>Ask BusWatch</h1><p>Questions answered directly from the dataset: no AI, every answer shows the numbers it is based on.</p></div>
    <div id="filters"></div>
    <section class="card">
      <div class="chips" id="chips"></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="ask-form" id="ask-form">
        <input type="text" id="ask-input" placeholder="e.g. When is the LRT stop busiest on Friday?" aria-label="Your question" autocomplete="off">
        <button class="btn primary" type="submit">Ask</button>
      </form>
    </section>
  </main>
  <footer>BusWatch prototype - All figures are <b>simulated data</b>, not real university records.</footer>
  <script type="module" src="js/ask.js"></script>
</body>
</html>
